name: ferventio-backend

services:
  postgres:
    image: postgres:18.4-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ferventio}
      POSTGRES_USER: ${POSTGRES_USER:-ferventio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ferventio}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ferventio}?sslmode=disable
      # FCM is an explicit opt-in. compose.fcm.yaml overrides this to true.
      FIREBASE_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge
