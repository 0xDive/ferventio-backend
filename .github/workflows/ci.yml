name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine3.23
        env:
          POSTGRES_DB: ferventio_test
          POSTGRES_USER: ferventio
          POSTGRES_PASSWORD: ferventio-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ferventio -d ferventio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://ferventio:ferventio-test-only@127.0.0.1:5432/ferventio_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Repository secret scan
        run: ./scripts/security/scan-repository-secrets.sh
      - name: Architecture boundaries
        run: ./scripts/architecture/check-package-boundaries.sh
      - name: Verify module checksums
        run: go mod verify
      - name: Verify formatting
        run: test -z "$(gofmt -l $(find . -type f -name '*.go' -not -path './vendor/*'))"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: PostgreSQL integration tests
        run: go test -tags=integration ./internal/storage/postgres
      - name: Build commands
        run: |
          CGO_ENABLED=0 go build -trimpath ./cmd/ferventio-backend
          CGO_ENABLED=0 go build -trimpath ./cmd/ferventio-migrate-json
          CGO_ENABLED=0 go build -trimpath ./cmd/vapid
      - name: Validate Compose configuration
        run: |
          cp config/examples/backend.env .env
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.fcm.yaml config --quiet
